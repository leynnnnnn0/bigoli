name: stampbayan

x-app: &app
  build:
    context: .
    target: application
  image: stampbayan-app
  restart: unless-stopped
  environment: &app-environment
    APP_NAME: StampBayan
    APP_ENV: local
    APP_KEY: "${APP_KEY:-base64:bG9jYWwtZG9ja2VyLWtleS1jaGFuZ2UtbWUtMTIzNDU=}"
    APP_DEBUG: "${APP_DEBUG:-true}"
    APP_URL: "${DOCKER_APP_URL:-http://localhost:8000}"
    LOG_CHANNEL: stderr
    LOG_LEVEL: "${LOG_LEVEL:-debug}"
    DB_CONNECTION: sqlite
    DB_DATABASE: /var/www/html/database/database.sqlite
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
  volumes:
    - sqlite-data:/var/www/html/database
    - app-storage:/var/www/html/storage

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  sqlite-data:
  app-storage:
